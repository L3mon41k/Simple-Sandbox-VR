name: Build Simple Sandbox VR (Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Export Android ARM64 OpenXR test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.4.1"
          use-dotnet: false
          include-templates: true

      - name: Validate project
        run: godot --headless --editor --path . --quit

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android OpenXR test" build/SimpleSandboxVR-OpenXR-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleSandboxVR-OpenXR-test-debug
          path: build/SimpleSandboxVR-OpenXR-test.apk
          if-no-files-found: error
          retention-days: 14
