name: Build Simple Sandbox VR (Android)

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Export Android ARM64 PICO OpenXR APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.4.1"
          use-dotnet: false
          include-templates: true

      - name: Install Godot OpenXR Vendors plugin
        run: |
          mkdir -p /tmp/openxr-vendors addons
          curl -L --fail --retry 3 \
            https://github.com/GodotVR/godot_openxr_vendors/releases/download/4.3.1-stable/godotopenxrvendorsaddon.zip \
            -o /tmp/openxr-vendors/plugin.zip
          unzip -q /tmp/openxr-vendors/plugin.zip -d /tmp/openxr-vendors
          PLUGIN_DIR="$(find /tmp/openxr-vendors -type d -path '*/addons/godotopenxrvendors' -print -quit)"
          if [ -z "$PLUGIN_DIR" ]; then
            echo "Could not find addons/godotopenxrvendors in the plugin archive."
            find /tmp/openxr-vendors -maxdepth 5 -type d
            exit 1
          fi
          cp -R "$PLUGIN_DIR" addons/
          test -d addons/godotopenxrvendors

      - name: Configure Godot Android export
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Validate project
        run: |
          mkdir -p build
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee build/validate.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" build/validate.log; then
            echo "Godot reported script errors; refusing to export APK."
            exit 1
          fi

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --install-android-build-template --export-debug "Android OpenXR test" build/SimpleSandboxVR-OpenXR-test.apk

      - name: Verify PICO immersive manifest
        run: |
          APK="build/SimpleSandboxVR-OpenXR-test.apk"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > build/manifest.txt
          grep -q "pvr.app.type" build/manifest.txt || { echo "Missing PICO VR application metadata"; exit 1; }
          grep -q "org.khronos.openxr.intent.category.IMMERSIVE_HMD" build/manifest.txt || { echo "Missing immersive OpenXR launch category"; exit 1; }
          echo "PICO VR metadata and immersive OpenXR launch category are present."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleSandboxVR-PICO-OpenXR-debug
          path: build/SimpleSandboxVR-OpenXR-test.apk
          if-no-files-found: error
          retention-days: 14
